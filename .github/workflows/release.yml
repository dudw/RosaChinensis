name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: 恢复签名材料
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES_BASE64: ${{ secrets.KEY_PROPERTIES_BASE64 }}
        run: |
          mkdir -p rosa_file
          echo "$KEYSTORE_BASE64" | base64 -d > rosa_file/period-tracker-release.jks
          echo "$KEY_PROPERTIES_BASE64" | base64 -d > rosa_file/key.properties

      - name: 安装依赖
        run: flutter pub get

      - name: 构建 APK（armv7 + armv8）
        run: flutter build apk --release --split-per-abi --target-platform=android-arm,android-arm64

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
